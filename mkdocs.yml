site_name: blockfin-docs
site_url: https://fiit-ba.github.io/docs/
theme:
  name: material
  custom_dir: overrides
markdown_extensions:
  - admonition
  - pymdownx.superfences
plugins:
  - search
  - mkdocs-jupyter
  - llmstxt:
      preprocess: llmstxt_preprocess.py
      markdown_description: Návody pre FIIT infraštruktúru (SSH na GPU servery Dencun a Pectra, LiteLLM proxy a zoznam modelov).
      full_output: llms-full.txt
      sections:
        Servery:
          - dencun.md: SSH prístup na GPU servery Dencun a Pectra
        LiteLLM:
          - litellm-quickstart.ipynb: Prvé volanie LiteLLM proxy
          - litellm-models.md: Zoznam dostupných modelov a aliasov
nav:
  - Home: index.md
  - SSH Dencun a Pectra: dencun.md
  - LiteLLM Quickstart: litellm-quickstart.ipynb
  - LiteLLM modely: litellm-models.md
